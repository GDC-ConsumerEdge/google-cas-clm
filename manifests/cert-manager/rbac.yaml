# subjects:
#   - kind: Group
#     name: "system:authenticated" # Or a specific developer group

---
# (Alternative) ClusterRole if using native Kubernetes CertificateSigningRequests (CSRs)
# instead of cert-manager's CertificateRequest CRD.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-csr-cas-requester
rules:
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["signers"]
    # Adjust this resource name to match your specific GoogleCASClusterIssuer name
    resourceNames: ["googlecasclusterissuers.cas-issuer.jetstack.io/*"]
    verbs: ["request", "approve"]
