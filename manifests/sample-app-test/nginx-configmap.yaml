apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: sample-test-app
data:
  default.conf: |
    server {
        listen 443 ssl;
        server_name nginx-server.sample-test-app.svc.cluster.local nginx-server.sample-test-app.svc;

        ssl_certificate /etc/tls/tls.crt;
        ssl_certificate_key /etc/tls/tls.key;

        location / {
            default_type text/plain;
            return 200 'Hello from NGINX secured with Google CAS TLS certificates!\n';
        }
    }
