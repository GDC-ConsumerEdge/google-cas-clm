apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-google-cas-issuer
  namespace: default
  labels:
    app.kubernetes.io/instance: cert-manager-google-cas-issuer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cert-manager-google-cas-issuer
    app.kubernetes.io/version: v0.13.0
    helm.sh/chart: cert-manager-google-cas-issuer-v0.13.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-manager-google-cas-issuer
  template:
    metadata:
      labels:
        app: cert-manager-google-cas-issuer
        app.kubernetes.io/instance: cert-manager-google-cas-issuer
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: cert-manager-google-cas-issuer
        app.kubernetes.io/version: v0.13.0
        helm.sh/chart: cert-manager-google-cas-issuer-v0.13.0
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      serviceAccountName: cert-manager-google-cas-issuer
      containers:
      - name: cert-manager-google-cas-issuer
        image: "quay.io/jetstack/cert-manager-google-cas-issuer:v0.13.0"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9402
        args:
          - --enable-leader-election
          - --log-level=1
          - --metrics-addr=:9402

        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
          readOnlyRootFilesystem: true
